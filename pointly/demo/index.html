    <!-- PWA cache-bust: runs synchronously before the app loads -->
    <script>
      (function () {
        var RESET_KEY = 'pwa-reset-v5';

        if (!localStorage.getItem(RESET_KEY)) {
          // Mark done first to prevent reload loop
          localStorage.setItem(RESET_KEY, '1');

          var done = function () { window.location.reload(true); };

          // Unregister all service workers then clear all caches, then reload
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              var unregs = regs.map(function (r) { return r.unregister(); });
              return Promise.all(unregs);
            }).then(function () {
              if ('caches' in window) {
                return caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                });
              }
            }).then(done).catch(done);
          } else if ('caches' in window) {
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).then(done).catch(done);
          } else {
            done();
          }

          // Stop loading old content while we wait for reload
          document.write('');
          return;
        }

        // Already reset — wire up auto-update for future SW updates
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.ready.then(function (reg) {
            if (reg.waiting) {
              reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            }
          });
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            window.location.reload();
          });
        }
      })();
    </script>
